name: Publish Contracts

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      modules: ${{ steps.detect.outputs.modules }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Detect modules
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            changed_files=$(git ls-tree -r --name-only HEAD)
          else
            changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          fi

          echo "Changed files:"
          echo "$changed_files"

          if echo "$changed_files" | grep -qE '^(build.gradle|settings.gradle|gradle.properties|gradle/)'; then
            modules=$(./gradlew -q listModules | jq -R -c 'split(",")')
          else
            all_modules=$(./gradlew -q listModules | tr ',' '\n')

            changed_modules=$(echo "$changed_files" \
              | awk -F/ '{print $1}' \
              | sort -u \
              | grep -Fxf <(echo "$all_modules") || true)

            modules=$(echo "$changed_modules" \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          echo "Modules to publish:"
          echo "$modules"

          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  publish:
    needs: detect-changes

    if: needs.detect-changes.outputs.modules != '[]'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Check if version already exists
        id: check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          MODULE="${{ matrix.module }}"

          VERSION=$(./gradlew -q :$MODULE:properties \
            | grep "^version:" \
            | awk '{print $2}')

          echo "Detected version: $VERSION"

          URL="https://maven.pkg.github.com/java-taxi-microservices/contracts/com/taxi/microservices/contracts/$MODULE/$VERSION/$MODULE-$VERSION.pom"

          STATUS=$(curl \
            -s \
            -o /dev/null \
            -w "%{http_code}" \
            -u "$GITHUB_ACTOR:$GITHUB_TOKEN" \
            "$URL")

          if [ "$STATUS" = "200" ]; then
            echo "Artifact already exists. Skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Artifact does not exist."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.skip == 'false'
        run: ./gradlew :${{ matrix.module }}:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Skip publish
        if: steps.check.outputs.skip == 'true'
        run: echo "Skipping ${{ matrix.module }} because this version already exists."