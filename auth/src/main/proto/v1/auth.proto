syntax = "proto3";

package auth.v1;

option java_package = "com.taxi.microservices.contracts.auth.v1";
option java_multiple_files = true;

import "google/protobuf/empty.proto";


service AuthService {
  rpc CreateDraftPhoneCredential(CreateDraftPhoneCredentialRequest)
      returns (CreateDraftPhoneCredentialResponse);

  rpc CreateDraftEmailCredential(CreateDraftEmailCredentialRequest)
      returns (CreateDraftEmailCredentialResponse);

  rpc DeleteDraftCredential(DeleteDraftCredentialRequest)
      returns (google.protobuf.Empty);

  rpc GenerateOtp(GenerateOtpRequest)
      returns (GenerateOtpResponse);

  rpc ConfirmOtp(ConfirmOtpRequest)
      returns (google.protobuf.Empty);
}

message CreateDraftPhoneCredentialRequest {
  string user_id = 1;
  string phone_number = 2;
}

message CreateDraftPhoneCredentialResponse {
  string credential_id = 1;
}

message CreateDraftEmailCredentialRequest {
  string user_id = 1;
  string email = 2;
}

message CreateDraftEmailCredentialResponse {
  string credential_id = 1;
}

message DeleteDraftCredentialRequest {
  string credential_id = 1;
}

message GenerateOtpRequest {
  string credential_id = 1;
}

message ConfirmOtpRequest {
  string otp_id = 1;
  string otp = 2;
}

message GenerateOtpResponse {
  string otp_id = 1;
}